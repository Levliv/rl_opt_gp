version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: rl-nginx
    ports:
      - "8000:8000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      rl-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - rl-network

  rl-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rl-ad-optimization
    expose:
      - "8000"
    environment:
      # API Authorization
      - API_KEY=${API_KEY}
      # Logging
      - LOG_LEVEL=INFO
      # S3 configuration для сохранения состояния LinUCB агента
      - S3_ENABLED=true
      - S3_BUCKET=${S3_BUCKET}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_REGION=${S3_REGION:-eu-central}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - rl-network

networks:
  rl-network:
    driver: bridge
